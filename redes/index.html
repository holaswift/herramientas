<style>
  /* Herramienta de redes de hola Swift. Interfaz en los tokens del libro de marca: fondo papel, Inter, botón azul de interfaz. */
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-Medium.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Inter Display"; src: url(assets/fonts/InterDisplay-Bold.woff2) format("woff2"); font-weight: 700; }
  :root {
    --fondo: #F7F7F7; --superficie: #FFFFFF; --linea: #E3E3E8; --texto: #111111; --texto-2: #55555F; --texto-3: #6E6E78;
    --interfaz: #007AFF; --boton: #0071E3; --mesa: #ECECF0;
    --radio-s: 8px; --radio-m: 16px; --radio-total: 999px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 400 15px/1.45 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .hs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: 32px; max-width: 1360px; margin: 0 auto; padding: 28px 28px 64px; }
  header.cab { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 4px; }
  header.cab .logo { height: 34px; width: auto; display: block; }
  header.cab .sep { width: 1px; height: 26px; background: var(--linea); }
  header.cab h1 { margin: 0; font: 700 26px/1 "Inter Display", "Inter", sans-serif; letter-spacing: -0.02em; }
  header.cab p { margin: 0 0 0 auto; color: var(--texto-3); font-size: 14px; }

  /* vista previa */
  .vista { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .formatos { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .formatos button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--superficie); border: 1px solid var(--linea); min-width: 0; }
  .formatos button canvas { width: 34px; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px var(--linea); flex: none; }
  .formatos button b { display: block; font-weight: 600; font-size: 14px; }
  .formatos button small { display: block; color: var(--texto-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .formatos button[aria-pressed="true"] { border-color: var(--interfaz); box-shadow: 0 0 0 1px var(--interfaz); }
  .formatos button:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--interfaz); outline-offset: 2px; }
  .mesa { background: var(--mesa) radial-gradient(circle, rgba(17,17,17,.10) 1px, transparent 1.2px) 0 0 / 18px 18px; border-radius: 22px; padding: 28px; display: grid; place-items: center; position: relative; }
  .mesa canvas.lienzo { display: block; max-width: 100%; max-height: calc(100vh - 280px); width: auto; height: auto; border-radius: 10px; box-shadow: 0 1px 0 rgba(17,17,17,.04), 0 24px 60px -24px rgba(17,17,17,.45); cursor: default; touch-action: none; }
  .mesa canvas.lienzo.arrastrable { cursor: grab; }
  .mesa .seguro { position: absolute; pointer-events: none; border: 2px dashed rgba(0,122,255,.55); border-left: 0; border-right: 0; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { all: unset; cursor: pointer; padding: 11px 18px; border-radius: var(--radio-total); font-weight: 600; background: var(--superficie); border: 1px solid var(--linea); }
  .btn.principal { background: var(--boton); color: #fff; border-color: var(--boton); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .aviso { color: var(--texto-2); font-size: 13px; }

  /* formulario */
  form.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  fieldset { border: 0; margin: 0; padding: 18px; background: var(--superficie); border-radius: 18px; box-shadow: 0 0 0 1px rgba(17,17,17,.05); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  legend { float: left; width: 100%; font: 600 15px/1.2 "Inter Display", "Inter", sans-serif; color: var(--texto); margin: 0 0 4px; padding: 0; }
  legend + * { clear: both; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; color: var(--texto-2); }
  label small { color: var(--texto-3); font-weight: 400; }
  input[type="text"], textarea, select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: var(--fondo); color: var(--texto); width: 100%; transition: background .15s, box-shadow .15s; }
  input[type="text"]:hover, textarea:hover { background: #F0F0F3; }
  textarea { min-height: 72px; resize: vertical; }
  textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; min-height: 140px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--interfaz); outline-offset: 0; border-color: transparent; }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fila > * { min-width: 0; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  #piezas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #piezas button { justify-content: flex-start; border-radius: 12px; padding: 12px 14px; background: var(--fondo); border-color: transparent; }
  #piezas button[aria-pressed="true"] { background: var(--texto); color: #fff; }
  .seg button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: var(--radio-total); background: var(--superficie); border: 1px solid var(--linea); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .seg button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); border-color: var(--texto); }
  .seg button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .seg.tema { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; padding: 3px; background: var(--fondo); border-radius: 12px; }
  .seg.tema button { justify-content: center; border: 0; border-radius: 9px; background: transparent; padding: 8px; }
  .seg.tema button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 3px rgba(17,17,17,.12); }
  .rango { display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .rango input { grid-column: 1 / -1; width: 100%; accent-color: var(--interfaz); }
  .rango output { color: var(--texto-3); font-variant-numeric: tabular-nums; }
  .pegs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .pegs button { all: unset; box-sizing: border-box; cursor: pointer; height: 72px; border-radius: 14px; background: var(--fondo); border: 1px solid transparent; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
  .pegs button img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pegs button[aria-pressed="true"] { border-color: var(--interfaz); box-shadow: 0 0 0 1px var(--interfaz); background: #EEF5FF; }
  .foto { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
  .foto .mini { width: 64px; height: 64px; border-radius: 50%; background: var(--linea) center/cover; }
  .foto .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .foto input[type="range"] { width: 100%; accent-color: var(--interfaz); }
  .foto .botones { display: flex; gap: 8px; flex-wrap: wrap; }
  .foto .botones label { all: unset; cursor: pointer; color: var(--boton); font-weight: 600; font-size: 14px; }
  .foto .botones button { all: unset; cursor: pointer; color: var(--texto-3); font-size: 14px; }
  .ayuda { color: var(--texto-3); font-size: 13px; margin: 0; }
  .pie-form { display: flex; justify-content: space-between; gap: 10px; color: var(--texto-3); font-size: 13px; padding: 4px 6px; }
  .pie-form button { all: unset; cursor: pointer; color: var(--texto-2); text-decoration: underline; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    .hs { grid-template-columns: 1fr; padding: 16px 16px 48px; gap: 20px; }
    .vista { position: static; }
    .mesa { padding: 12px; }
    .mesa canvas.lienzo { max-height: 36vh; }
    .formatos button { flex-direction: column; gap: 6px; padding: 8px 4px; text-align: center; }
    .formatos button small { display: none; }
    .formatos button b { font-size: 12px; }
  }
</style>
<div class="hs">
  <header class="cab"><img src="assets/logo/hola-swift-horizontal-color.webp" alt="hola Swift" class="logo"><span class="sep" aria-hidden="true"></span><h1>Redes</h1><p>Elige una pieza, cambia los textos y descarga.</p></header>

  <section class="vista" aria-label="Vista previa">

<script>/* hola Swift · Redes — motor de dibujo (canvas 2D, sin librerías).
   window.HolaRedes = R. Cada pieza es una función que dibuja en un contexto de W×H a partir del estado.
   Colores y tipografías: libro de marca de hola Swift (tokens). */
(function () {
  const R = {};

  // ── Marca ───────────────────────────────────────────────────────────────
  R.TEMAS = {
    claro:  { fondo: '#F7F7F7', superficie: '#FFFFFF', linea: '#E3E3E8', texto: '#111111', texto2: '#55555F', texto3: '#6E6E78', enlace: '#0066CC', logo: 'logoClaro' },
    oscuro: { fondo: '#0C0B0B', superficie: '#17171A', linea: '#2A2A2F', texto: '#FFFFFF', texto2: '#B8B8C2', texto3: '#8C8C96', enlace: '#2997FF', logo: 'logoOscuro' },
  };
  // espectro hola: rellenos (texto encima: #111111, salvo violeta y azul: blanco)
  R.ESPECTRO = {
    lavanda: '#7586EC', verde: '#33C468', amarillo: '#FFB823', naranja: '#FF7039',
    rosa: '#FF4F8B', magenta: '#D553D3', violeta: '#6D5FF0', azul: '#3772F0',
  };
  R.SOBRE = { violeta: '#FFFFFF', azul: '#FFFFFF' };          // el resto: #111111
  R.BOTON = '#0071E3';
  R.F = { titulos: '"Inter Display", "Inter", system-ui, sans-serif', texto: '"Inter", system-ui, sans-serif', codigo: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace' };

  R.FORMATOS = {
    post:       { w: 1080, h: 1350, nombre: 'Post',       uso: 'Instagram, LinkedIn' },
    story:      { w: 1080, h: 1920, nombre: 'Story',      uso: 'Instagram, WhatsApp', seguro: [250, 1640] },
    cuadrado:   { w: 1080, h: 1080, nombre: 'Cuadrado',   uso: 'Instagram, LinkedIn' },
    horizontal: { w: 1200, h: 675,  nombre: 'Horizontal', uso: 'X, LinkedIn, web' },
  };

  R.PIEZAS = {
    charla:   { nombre: 'Charla mensual', acento: 'azul' },
    persona:  { nombre: 'Embajador/a',    acento: 'verde' },
    evento:   { nombre: 'Encuentro',      acento: 'naranja' },
    codigo:   { nombre: 'Código',         acento: null },
    pregunta: { nombre: 'Pregunta',       acento: 'rosa' },
  };

  R.PEGATINAS = ['llaves', 'codigo', 'enye', 'arroba', 'corazon', 'abre', 'pregunta', 'mano'];
  R.NOMBRE_PEGATINA = { llaves: '{ }', codigo: '</>', enye: 'ñ', arroba: '@', corazon: '♥', abre: '¿', pregunta: '?', mano: 'Mano' };

  // ── Recursos ────────────────────────────────────────────────────────────
  // Rutas relativas; build.py las sustituye por data: URIs en la versión de un solo archivo.
  R.RUTAS = {
    hola: 'assets/tubo/hola.webp', holaBlanco: 'assets/tubo/hola-blanco.webp', bang: 'assets/tubo/bang.webp',
    swift: 'assets/tubo/swift.webp', mano: 'assets/tubo/mano.webp',
    logoClaro: 'assets/logo/hola-swift-horizontal-color.webp', logoOscuro: 'assets/logo/hola-swift-horizontal-color.webp',
    logoNegro: 'assets/logo/hola-swift-horizontal-negro.webp', logoBlanco: 'assets/logo/hola-swift-horizontal-blanco.webp',
  };
  R.PEGATINAS.forEach((p) => (R.RUTAS['peg-' + p] = 'assets/pegatinas/' + p + '.webp'));
  R.FUENTES = [
    ['Inter Display', 'assets/fonts/InterDisplay-SemiBold.woff2', '600'],
    ['Inter Display', 'assets/fonts/InterDisplay-Bold.woff2', '700'],
    ['Inter', 'assets/fonts/Inter-Regular.woff2', '400'],
    ['Inter', 'assets/fonts/Inter-Medium.woff2', '500'],
    ['Inter', 'assets/fonts/Inter-SemiBold.woff2', '600'],
  ];
  R.img = {};
  R.cargar = async function () {
    const urls = window.HOLA_REDES_DATOS || {};             // versión de un solo archivo
    const fuentes = R.FUENTES.map(([fam, url, w]) => {
      const f = new FontFace(fam, `url(${urls[url] || url})`, { weight: w });
      return f.load().then((ff) => document.fonts.add(ff)).catch(() => console.warn('No se pudo cargar', url));
    });
    const imgs = Object.entries(R.RUTAS).map(([k, url]) => new Promise((ok) => {
      const im = new Image(); im.onload = () => { R.img[k] = im; ok(); }; im.onerror = () => { console.warn('Falta', url); ok(); };
      im.src = urls[url] || url;
    }));
    await Promise.all([...fuentes, ...imgs]);
  };

  // ── Utilidades ──────────────────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  R.clamp = clamp;
  function fuente(ctx, fam, peso, px, track) {
    ctx.font = `${peso} ${px}px ${R.F[fam]}`;
    ctx.letterSpacing = (track || 0) * px + 'px';
  }
  function partir(ctx, texto, ancho) {                          // respeta saltos de línea manuales
    const out = [];
    String(texto || '').split('\n').forEach((par) => {
      const pal = par.split(/\s+/).filter(Boolean); let l = '';
      if (!pal.length) { out.push(''); return; }
      pal.forEach((p) => { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > ancho && l) { out.push(l); l = p; } else l = t; });
      out.push(l);
    });
    return out;
  }
  // texto que encoge hasta caber en maxLineas y ancho; devuelve {lineas, px, alto}
  function ajustar(ctx, texto, { fam = 'titulos', peso = 700, px, min, ancho, maxLineas = 3, inter = 1.06, track = -0.02 }) {
    let s = px;
    for (; s >= min; s -= 2) {
      fuente(ctx, fam, peso, s, track);
      const ls = partir(ctx, texto, ancho);
      if (ls.length <= maxLineas && ls.every((l) => ctx.measureText(l).width <= ancho)) return { lineas: ls, px: s, alto: ls.length * s * inter, fam, peso, inter, track };
    }
    fuente(ctx, fam, peso, min, track);
    const ls = partir(ctx, texto, ancho).slice(0, maxLineas);
    return { lineas: ls, px: min, alto: ls.length * min * inter, fam, peso, inter, track };
  }
  function pintarTexto(ctx, b, x, y, color, alinear = 'left') {
    fuente(ctx, b.fam, b.peso, b.px, b.track); ctx.fillStyle = color; ctx.textAlign = alinear; ctx.textBaseline = 'alphabetic';
    b.lineas.forEach((l, i) => ctx.fillText(l, x, y + b.px * 0.92 + i * b.px * b.inter));
    ctx.textAlign = 'left';
  }
  function redondo(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); }
  // cubrir: object-fit cover + punto de foco (fx, fy en 0..1) + zoom
  function cubrir(ctx, im, x, y, w, h, fx = 0.5, fy = 0.4, zoom = 1) {
    const k = Math.max(w / im.width, h / im.height) * zoom, sw = im.width * k, sh = im.height * k;
    ctx.drawImage(im, x - (sw - w) * fx, y - (sh - h) * fy, sw, sh);
  }
  R.cubrir = cubrir;
  function colorAcento(nombre) { return R.ESPECTRO[nombre]; }
  function tintaSobre(nombre) { return R.SOBRE[nombre] || '#111111'; }
  // imagen con sombra suave (pegatinas y tubos)
  function conSombra(ctx, fn, u, fuerza = 1) {
    ctx.save(); ctx.shadowColor = `rgba(17,17,17,${0.16 * fuerza})`; ctx.shadowBlur = 36 * u; ctx.shadowOffsetY = 14 * u; fn(); ctx.restore();
  }
  function pegatina(ctx, nombre, cx, cy, alto, rot, u) {
    const im = R.img['peg-' + nombre]; if (!im) return;
    const w = im.width * alto / im.height;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(im, -w / 2, -alto / 2, w, alto); ctx.restore();
  }
  // ── El bloque "hola + X!" (sin "¡": la marca solo usa el "!" de cierre, el force unwrap de Swift) ──
  // El "hola" es el tubo 3D (no se redibuja); X va en Inter Display Bold en `texto`. Medidas relativas al alto del tubo.
  const HOLA = { base: 0.90, ojo: 0.52 };                     // línea base y altura de la "o" como fracción del alto del png
  function medirHola(ctx, X, alto, signos) {
    const ih = R.img.hola, ib = R.img.bang;
    const wHola = ih ? ih.width * alto / ih.height : alto * 2.66;
    const altoSigno = alto * 0.86, wB = ib ? ib.width * altoSigno / ib.height : alto * 0.2;
    const px = alto * 0.78;                                    // mayúscula de X ≈ 0,57 del alto del tubo (Inter: 0,727 em)
    fuente(ctx, 'titulos', 700, px, -0.025);
    const wX = X ? ctx.measureText(X).width : 0;
    const gap = alto * 0.07;
    const linea1 = wHola;
    const linea2 = X ? wX + (signos ? gap * 0.6 + wB : 0) : 0;
    return { wHola, wB, wX, px, gap, altoSigno, linea1, linea2, una: linea1 + (X ? gap * 1.6 + linea2 : (signos ? gap + wB : 0)) };
  }
  // dibuja y devuelve el alto ocupado. modo: 'auto' | 'una' | 'dos'
  function bloqueHola(ctx, X, x, y, anchoMax, altoPref, altoMin, color, { signos = true, modo = 'auto', alinear = 'left', brillo = false } = {}) {
    X = (X || '').trim();
    let alto = altoPref, m = medirHola(ctx, X, alto, signos), dos = modo === 'dos';
    if (modo === 'auto') {
      if (m.una > anchoMax) { const k = anchoMax / m.una; if (k >= 0.8 || !X) { alto *= k; } else dos = true; }   // antes partir en dos líneas que encoger mucho
    } else if (modo === 'una' && m.una > anchoMax) alto *= anchoMax / m.una;
    m = medirHola(ctx, X, alto, signos);
    if (dos) { const w = Math.max(m.linea1, m.linea2); if (w > anchoMax) { alto *= anchoMax / w; m = medirHola(ctx, X, alto, signos); } }
    const base1 = y + alto * HOLA.base;
    const anchoTotal = dos ? Math.max(m.linea1, m.linea2) : m.una;
    let cx = alinear === 'center' ? x + (anchoMax - anchoTotal) / 2 : x;
    const dibSigno = (im, wx, base, w) => { if (im) ctx.drawImage(im, wx, base - m.altoSigno * 0.98, w, m.altoSigno); };
    let px1 = cx;
    if (brillo && R.img.hola) {                                 // en oscuro, el tubo brilla (como el "hello" de keynote)
      ctx.save(); ctx.filter = `blur(${alto * 0.14}px)`; ctx.globalAlpha = 0.6;
      ctx.drawImage(R.img.hola, px1, y, m.wHola, alto); ctx.restore();
    }
    ctx.save(); ctx.shadowColor = brillo ? 'rgba(0,0,0,0)' : 'rgba(17,17,17,0.10)'; ctx.shadowBlur = 24 * alto / 300; ctx.shadowOffsetY = 10 * alto / 300;
    if (R.img.hola) ctx.drawImage(R.img.hola, px1, y, m.wHola, alto);
    ctx.restore();
    let fin;

  // ── Entrada pública ─────────────────────────────────────────────────────

    pieza: 'charla', formato: 'post', tema: 'claro', escala: 1, temaCodigo: 'oscuro',     charla:   { numero: '1', tema: 'SwiftUI', titulo: 'Animaciones que se sienten nativas', fecha: 'Miércoles 20 de enero', hora: '19:00 (España)', lugar: 'Online', ponente0: 'Nombre Apellido', rol0: 'iOS developer en Empresa', ponente1: '', rol1: '' },

    evento:   { ciudad: '2027', fecha: 'Fecha por anunciar', lugar: 'Ciudad y sede por anunciar', boton: 'holaswift.com' },
    codigo:   { archivo: 'Comunidad.swift', codigo: 'let comunidad = "en español"\n\nif estásSolo {\n    únete()\n}', texto: 'Ya no estáis solos.' },

<script>/* hola Swift · Redes — interfaz. Lee y escribe un único objeto de estado (solo en memoria: no se guarda nada). */
(function () {
  const R = window.HolaRedes, $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const CLAVE = 'holaswift-redes-v1';
  const copia = (o) => JSON.parse(JSON.stringify(o));
  let s = copia(R.BASE); s.fotos = {};
  // No se guarda nada: cada vez que se abre, empieza de cero. Borra lo que guardaban versiones anteriores.
  try { localStorage.removeItem(CLAVE); } catch (e) {}
  const fotosIm = {};                                          // id -> {im, fx, fy, zoom}

  // ── Campos por pieza ─────────────────────────────────────────────────────
  const CAMPOS = {
    charla: [
      ['fila', ['numero', 'Número', 'text', 'Charla #'], ['tema', 'Tema', 'text', 'Sale enorme: SwiftUI, Xcode…']],
      ['titulo', 'Título de la charla', 'area'], ['fila', ['fecha', 'Fecha', 'text'], ['hora', 'Hora', 'text']], ['lugar', 'Dónde', 'text'],
      ['fila', ['ponente0', 'Ponente', 'text'], ['rol0', 'Rol', 'text']],
      ['fila', ['ponente1', 'Segundo ponente', 'text', 'Opcional'], ['rol1', 'Rol', 'text']],
    ],
    persona: [['etiqueta', 'Etiqueta', 'text', 'Embajadora, Embajador, Ponente…'], ['nombre', 'Nombre', 'text'], ['ciudad', 'Ciudad', 'text'], ['frase', 'Frase', 'area', 'Opcional']],
    evento: [['ciudad', 'Palabra grande', 'text', 'Una ciudad, un año…'], ['fecha', 'Fecha', 'text'], ['fila', ['lugar', 'Lugar', 'text'], ['boton', 'Última línea', 'text', 'Opcional']]],
    codigo: [['archivo', 'Nombre del archivo', 'text', 'Opcional'], ['codigo', 'Código', 'mono', 'Swift, hasta 12 líneas'], ['texto', 'Frase debajo', 'area']],
    pregunta: [['pregunta', 'Pregunta', 'area', 'Con sus signos: ¿…?'], ['texto', 'Texto debajo', 'area', 'Opcional']],
  };
  const FOTOS = { charla: [['ponente0', 'Ponente'], ['ponente1', 'Segundo ponente']], persona: [['persona', 'Foto']] };

  // ── Construcción del formulario ──────────────────────────────────────────
  const piezas = $('#piezas');
  Object.entries(R.PIEZAS).forEach(([k, p]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = k;
    b.innerHTML = (p.acento ? `<i style="background:${R.ESPECTRO[p.acento]}"></i>` : '<i style="background:#111"></i>') + p.nombre;
    b.onclick = () => { s.pieza = k; montar(); pintar(); };
    piezas.append(b);
  });
  function campo([clave, etiqueta, tipo, ayuda]) {
    const l = document.createElement('label');
    l.append(etiqueta); if (ayuda) { const sm = document.createElement('small'); sm.textContent = ayuda; l.append(sm); }
    const el = tipo === 'text' ? document.createElement('input') : document.createElement('textarea');
    if (tipo === 'text') el.type = 'text'; if (tipo === 'mono') { el.className = 'mono'; el.spellcheck = false; }
    el.id = `${s.pieza}-${clave}`; el.value = s[s.pieza][clave] || '';
    el.oninput = () => { s[s.pieza][clave] = el.value; pintar(); };
    l.append(el); return l;
  }
  function montar() {
    $$('#piezas button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === s.pieza));
    const cs = $('#campos'); cs.replaceChildren(cs.querySelector('legend') || Object.assign(document.createElement('legend'), { textContent: 'Textos' }));
    CAMPOS[s.pieza].forEach((c) => {
      if (c[0] === 'fila') { const f = document.createElement('div'); f.className = 'fila'; f.append(campo(c[1]), campo(c[2])); cs.append(f); }
      else cs.append(campo(c));
    });
    // fotos
    const fs = $('#fotos'); fs.hidden = !FOTOS[s.pieza];
    $$('.foto', fs).forEach((n) => n.remove());
    (FOTOS[s.pieza] || []).forEach(([id, nombre]) => fs.append(controlFoto(id, nombre)));
    $$('#tema button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === s.tema));
    $('.rango').hidden = s.pieza === 'persona';
  }
  function controlFoto(id, nombre) {
    const d = document.createElement('div'); d.className = 'foto';
    const f = s.fotos[id];
    d.innerHTML = `<div class="mini" style="${f && f.src ? `background-image:url(${f.src})` : ''}"></div>
      <div class="ctl"><b>${nombre}</b>
        <div class="botones"><label>${f && f.src ? 'Cambiar' : 'Subir'} foto<input type="file" accept="image/*" hidden></label>${f && f.src ? '<button type="button">Quitar</button>' : ''}</div>
        ${f && f.src ? `<label style="font-weight:400;font-size:13px;color:var(--texto-3)">Zoom<input type="range" min="1" max="2.5" step="0.01" value="${f.zoom || 1}"></label>` : ''}
      </div>`;
    $('input[type=file]', d).onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const src = await reducir(file, 1600);
      s.fotos[id] = { src, fx: 0.5, fy: 0.35, zoom: 1 }; await cargarFoto(id); montar(); pintar();
    };
    const q = $('.botones button', d); if (q) q.onclick = () => { delete s.fotos[id]; delete fotosIm[id]; montar(); pintar(); };
    const r = $('input[type=range]', d); if (r) r.oninput = () => { s.fotos[id].zoom = +r.value; fotosIm[id].zoom = +r.value; pintar(); };
    return d;
  }
  function reducir(file, max) {
    return new Promise((ok, ko) => {
      const url = URL.createObjectURL(file), im = new Image();

  function cargarFoto(id) {
    const f = s.fotos[id]; if (!f || !f.src) return Promise.resolve();
    return new Promise((ok) => { const im = new Image(); im.onload = () => { fotosIm[id] = { im, fx: f.fx, fy: f.fy, zoom: f.zoom || 1 }; ok(); }; im.onerror = ok; im.src = f.src; });
  }
  const esc = $('#escala'), escV = () => ($('#escalaVal').textContent = Math.round((s.escala || 1) * 100) + ' %');
  esc.value = s.escala || 1; escV();
  esc.oninput = () => { s.escala = +esc.value; escV(); pintar(); };
  esc.ondblclick = () => { s.escala = 1; esc.value = 1; escV(); pintar(); };
  $$('#tema button').forEach((b) => (b.onclick = () => { s.tema = b.dataset.v; montar(); pintar(); }));
  $("#reset").onclick = () => { const f = s.formato; s = copia(R.BASE); s.fotos = {}; s.formato = f; for (const k in fotosIm) delete fotosIm[k]; $("#escala").value = 1; $("#escalaVal").textContent = "100 %"; montar(); pintar(); estado("Todo vuelve a los textos de ejemplo."); };

  // ── Formatos y vista previa ──────────────────────────────────────────────
  const lienzo = $('canvas.lienzo'), seguro = $('.seguro');
  const fmts = $('.formatos');
  Object.entries(R.FORMATOS).forEach(([k, F]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = k;
    const mini = document.createElement('canvas'); mini.width = 68; mini.height = Math.round(68 * F.h / F.w);
    b.append(mini); const t = document.createElement('span'); t.innerHTML = `<b>${F.nombre}</b><small>${F.w}×${F.h} · ${F.uso}</small>`; b.append(t);
    b.onclick = () => { s.formato = k; pintar(); };
    fmts.append(b);
  });
  let zonas = [], pendiente = false, miniT = 0;
  function pintar() {
    if (pendiente) return; pendiente = true;
    requestAnimationFrame(() => {
      pendiente = false;
      zonas = R.componer(lienzo, s.formato, s, fotosIm);
      estado(R.aviso || '');
      lienzo.classList.toggle('arrastrable', zonas.some((z) => fotosIm[z.id]));
      $$('.formatos button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === s.formato));
      colocarSeguro();
      clearTimeout(miniT); miniT = setTimeout(miniaturas, 380);
    });
  }
  function miniaturas() {
    const tmp = document.createElement('canvas');
    $$('.formatos button').forEach((b) => { R.componer(tmp, b.dataset.v, s, fotosIm); const m = $('canvas', b); const c = m.getContext('2d'); c.clearRect(0, 0, m.width, m.height); c.drawImage(tmp, 0, 0, m.width, m.height); });
  }
  function colocarSeguro() {
    const F = R.FORMATOS[s.formato];
    if (!F.seguro || !$('#verSeguro').checked) { seguro.hidden = true; return; }
    const r = lienzo.getBoundingClientRect(), p = lienzo.parentElement.getBoundingClientRect(), k = r.height / F.h;
    Object.assign(seguro.style, { left: r.left - p.left + 'px', width: r.width + 'px', top: r.top - p.top + F.seguro[0] * k + 'px', height: (F.seguro[1] - F.seguro[0]) * k + 'px' });
    seguro.hidden = false;
  }
  $('#verSeguro').onchange = colocarSeguro; addEventListener('resize', colocarSeguro);

  // arrastrar para encuadrar una foto
  let arr = null;
  lienzo.addEventListener('pointerdown', (e) => {
    const r = lienzo.getBoundingClientRect(), k = lienzo.width / r.width, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
    const z = [...zonas].reverse().find((z) => fotosIm[z.id] && x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h);
    if (!z) return;
    arr = { z, x: e.clientX, y: e.clientY, k }; lienzo.setPointerCapture(e.pointerId); lienzo.style.cursor = 'grabbing';
  });
  lienzo.addEventListener('pointermove', (e) => {
    if (!arr) return;
    const f = fotosIm[arr.z.id], im = f.im, z = arr.z;
    const esc = Math.max(z.w / im.width, z.h / im.height) * f.zoom, sobraX = im.width * esc - z.w, sobraY = im.height * esc - z.h;
    const dx = (e.clientX - arr.x) * arr.k, dy = (e.clientY - arr.y) * arr.k; arr.x = e.clientX; arr.y = e.clientY;
    if (sobraX > 1) f.fx = R.clamp(f.fx - dx / sobraX, 0, 1);
    if (sobraY > 1) f.fy = R.clamp(f.fy - dy / sobraY, 0, 1);

  lienzo.addEventListener('pointerup', soltar); lienzo.addEventListener('pointercancel', soltar);

  const slug = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  function nombre(fmt) {
    const d = s[s.pieza], clave = { charla: d.tema, persona: d.nombre, evento: d.ciudad, codigo: d.archivo || d.texto, pregunta: d.pregunta }[s.pieza];
    return ['holaswift', s.pieza, slug(clave), fmt].filter(Boolean).join('-') + '.png';
  }
  function blob(fmt) { const c = document.createElement('canvas'); R.componer(c, fmt, s, fotosIm); return new Promise((ok) => c.toBlob(ok, 'image/png')); }

  let dlP = null;
  const descargas = () => (dlP = dlP || (window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null)));

    const dl = await descargas();

      for (const f of files) {
        try { await dl.save({ filename: f.name, data: f }); }

    return true;
  }
  $('#descargar').onclick = async () => { const b = await blob(s.formato); if (await entregar([new File([b], nombre(s.formato), { type: 'image/png' })])) estado('Descargado: ' + nombre(s.formato)); };
  $('#todos').onclick = async () => {
    const btn = $('#todos'); btn.disabled = true; estado('Preparando los cuatro formatos…');
    const files = [];
    for (const f of Object.keys(R.FORMATOS)) files.push(new File([await blob(f)], nombre(f), { type: 'image/png' }));
    try {
      if (TOCA && !(await descargas())) throw 0;
      await cargarZip();
      const zip = new window.JSZip(); files.forEach((f) => zip.file(f.name, f));
      const z = await zip.generateAsync({ type: 'blob' });
      const ok = await entregar([new File([z], `holaswift-${s.pieza}-${slug(nombre('').replace('.png', ''))}.zip`.replace(/-+\.zip$/, '.zip'), { type: 'application/zip' })]);
      btn.disabled = false; if (ok) estado('Listo: ' + files.length + ' imágenes en un zip.'); return;
    } catch (e) { const ok = await entregar(files); btn.disabled = false; if (ok) estado('Listo: ' + files.length + ' imágenes.'); return; }
  };
  function cargarZip() {
    if (window.JSZip) return Promise.resolve();
    return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = ok; sc.onerror = ko; document.head.append(sc); });
  }
  function estado(t) { $('#estado').textContent = t; }

  // ── Arranque ─────────────────────────────────────────────────────────────
  estado('Cargando tipografías e imágenes…');
  R.cargar().then(async () => {
    await Promise.all(Object.keys(s.fotos || {}).map(cargarFoto));
    montar(); pintar(); estado('');
  });
})();
