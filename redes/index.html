<style>
  /* hola Swift social tool. The UI uses the brand book tokens: paper background, Inter, blue UI button. */
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-Regular.woff2) format("woff2"); font-weight: 400; }
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-Medium.woff2) format("woff2"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url(assets/fonts/Inter-SemiBold.woff2) format("woff2"); font-weight: 600; }
  @font-face { font-family: "Inter Display"; src: url(assets/fonts/InterDisplay-Bold.woff2) format("woff2"); font-weight: 700; }
  :root {
    --bg: #F7F7F7; --surface: #FFFFFF; --line: #E3E3E8; --text: #111111; --text-2: #55555F; --text-3: #6E6E78;
    --ui: #007AFF; --button: #0071E3; --stage: #ECECF0;
    --radius-s: 8px; --radius-m: 16px; --radius-full: 999px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.45 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .hs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 420px); gap: 32px; max-width: 1360px; margin: 0 auto; padding: 28px 28px 64px; }
  header.masthead { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 4px; }
  header.masthead .logo { height: 34px; width: auto; display: block; }
  header.masthead .sep { width: 1px; height: 26px; background: var(--line); }
  header.masthead h1 { margin: 0; font: 700 26px/1 "Inter Display", "Inter", sans-serif; letter-spacing: -0.02em; }
  header.masthead p { margin: 0 0 0 auto; color: var(--text-3); font-size: 14px; }

  /* preview */
  .preview { position: sticky; top: 20px; align-self: start; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .formats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .formats button { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
  .formats button canvas { width: 34px; height: auto; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); flex: none; }
  .formats button b { display: block; font-weight: 600; font-size: 14px; }
  .formats button small { display: block; color: var(--text-3); font-size: 12px; line-height: 1.35; }
  .formats button small.networks { display: flex; gap: 6px; margin-top: 4px; }
  .formats button small.networks svg { width: 14px; height: 14px; flex: none; }
  .formats button[aria-pressed="true"] { border-color: var(--ui); box-shadow: 0 0 0 1px var(--ui); }
  .formats button:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--ui); outline-offset: 2px; }
  .stage { background: var(--stage) radial-gradient(circle, rgba(17,17,17,.10) 1px, transparent 1.2px) 0 0 / 18px 18px; border-radius: 22px; padding: 28px; display: grid; place-items: center; position: relative; }
  .stage canvas.artboard { display: block; max-width: 100%; max-height: calc(100vh - 280px); width: auto; height: auto; border-radius: 10px; box-shadow: 0 1px 0 rgba(17,17,17,.04), 0 24px 60px -24px rgba(17,17,17,.45); cursor: default; touch-action: none; }
  .stage canvas.artboard.draggable { cursor: grab; }
  .stage .safe-zone { position: absolute; pointer-events: none; border: 2px dashed rgba(0,122,255,.55); border-left: 0; border-right: 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { all: unset; cursor: pointer; padding: 11px 18px; border-radius: var(--radius-full); font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
  .btn.primary { background: var(--button); color: #fff; border-color: var(--button); }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .note { color: var(--text-2); font-size: 13px; }

  /* form */
  form.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  fieldset { border: 0; margin: 0; padding: 18px; background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px rgba(17,17,17,.05); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  legend { float: left; width: 100%; font: 600 15px/1.2 "Inter Display", "Inter", sans-serif; color: var(--text); margin: 0 0 4px; padding: 0; }
  legend + * { clear: both; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; color: var(--text-2); }
  label small { color: var(--text-3); font-weight: 400; }
  input[type="text"], textarea, select { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: var(--bg); color: var(--text); width: 100%; transition: background .15s, box-shadow .15s; }
  input[type="text"]:hover, textarea:hover { background: #F0F0F3; }
  textarea { min-height: 72px; resize: vertical; }
  textarea.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; min-height: 140px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--ui); outline-offset: 0; border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 0 10px; }
  .row > * { min-width: 0; }
  /* label, help and box on three shared rows: if only one field has help, both stay aligned */
  .row > label { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 0; }
  .row > label > small { margin-top: 6px; }
  .row > label > input, .row > label > textarea { grid-row: 3; margin-top: 6px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  #pieces { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #pieces button { justify-content: flex-start; border-radius: 12px; padding: 12px 14px; background: var(--bg); border-color: transparent; }
  #pieces button[aria-pressed="true"] { background: var(--text); color: #fff; }
  .seg button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--line); font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .seg button i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .seg.switch { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; padding: 3px; background: var(--bg); border-radius: 12px; }
  #theme { grid-template-columns: repeat(4, 1fr); }
  .seg.switch button { justify-content: center; border: 0; border-radius: 9px; background: transparent; padding: 8px; }
  .seg.switch button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(17,17,17,.12); }
  .range { display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .range input { grid-column: 1 / -1; width: 100%; accent-color: var(--ui); }
  .range output { color: var(--text-3); font-variant-numeric: tabular-nums; }
  .glyphs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .glyphs button { all: unset; box-sizing: border-box; cursor: pointer; height: 72px; border-radius: 14px; background: var(--bg); border: 1px solid transparent; display: flex; align-items: center; justify-content: center; padding: 10px; overflow: hidden; }
  .glyphs button img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .glyphs button[aria-pressed="true"] { border-color: var(--ui); box-shadow: 0 0 0 1px var(--ui); background: #EEF5FF; }
  .photo { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
  .photo .mini { width: 64px; height: 64px; border-radius: 50%; background: var(--line) center/cover; }
  .photo .ctl { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .photo input[type="range"] { width: 100%; accent-color: var(--ui); }
  .photo .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  .photo .buttons label { all: unset; cursor: pointer; color: var(--button); font-weight: 600; font-size: 14px; }
  .photo .buttons button { all: unset; cursor: pointer; color: var(--text-3); font-size: 14px; }
  .help { color: var(--text-3); font-size: 13px; margin: 0; }
  .seg-field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; color: var(--text-2); }
  .group { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 14px; background: var(--bg); }
  .group-title { margin: 0; font-weight: 600; font-size: 14px; color: var(--text); }
  .group-title small { font-weight: 400; font-size: 13px; color: var(--text-3); }
  .group input[type="text"] { background: var(--surface); }
  .group input[type="text"]:hover { background: #FBFBFC; }
  .form-footer { display: flex; justify-content: space-between; gap: 10px; color: var(--text-3); font-size: 13px; padding: 4px 6px; }
  .form-footer button { all: unset; cursor: pointer; color: var(--text-2); text-decoration: underline; }
  [hidden] { display: none !important; }
  @media (max-width: 900px) {
    .hs { grid-template-columns: 1fr; padding: 16px 16px 48px; gap: 20px; }
    .preview { position: static; }
    .stage { padding: 12px; }
    .stage canvas.artboard { max-height: 36vh; }
    .formats button { flex-direction: column; gap: 6px; padding: 8px 4px; text-align: center; }
    .formats button small { display: none; }
    .formats button b { font-size: 12px; }
  }
</style>
<div class="hs">
  <header class="masthead"><img src="assets/logo/hola-swift-horizontal-color.webp" alt="hola Swift" class="logo"><span class="sep" aria-hidden="true"></span><h1>Redes</h1><p>Elige una pieza y su fondo, añade textos y fotos, y descárgala en el tamaño de cada red.</p></header>

  <section class="preview" aria-label="Vista previa">
    <div class="formats" role="group" aria-label="Formato"></div>
    <div class="stage"><canvas class="artboard" aria-label="Vista previa de la pieza"></canvas><div class="safe-zone" hidden></div></div>
    <div class="actions">
      <button type="button" class="btn primary" id="download">Descargar</button>
      <button type="button" class="btn" id="all-formats">Los cuatro formatos</button>
      <label class="note" style="flex-direction:row;align-items:center;gap:6px;font-weight:400"><input type="checkbox" id="show-safe" checked> Zona segura en story</label>
    </div>
    <p class="note" id="status" role="status"></p>
  </section>

  <form class="panel" autocomplete="off" onsubmit="return false">
    <fieldset>
      <legend>Pieza</legend>
      <div class="seg" id="pieces" role="group" aria-label="Pieza"></div>
    </fieldset>
    <fieldset>
      <legend>Estilo</legend>
      <div class="seg-field">Fondo
      <div class="seg switch" id="theme" role="group" aria-label="Fondo">
        <button type="button" data-v="light">Claro</button><button type="button" data-v="dark">Oscuro</button><button type="button" data-v="color">Color 1</button><button type="button" data-v="color2">Color 2</button></div></div>
      <label class="range">Tamaño del tubo <output id="scale-value"></output><input type="range" id="scale" min="0.6" max="1.6" step="0.05"></label>
    </fieldset>
    <fieldset id="fields"><legend>Textos</legend></fieldset>

  </form>

<script>/* hola Swift · Redes: drawing engine (2D canvas, no libraries).
   window.HolaSocial = R. Each piece is a function that draws on a W×H context from the state.
   Colours and typefaces: hola Swift brand book (tokens). */
(function () {
  const R = {};

  // ── Brand ───────────────────────────────────────────────────────────────
  R.THEMES = {
    light: { bg: '#F7F7F7', surface: '#FFFFFF', line: '#E3E3E8', text: '#111111', text2: '#55555F', text3: '#6E6E78', link: '#0066CC', logo: 'logoLight' },
    dark:  { bg: '#0C0B0B', surface: '#17171A', line: '#2A2A2F', text: '#FFFFFF', text2: '#B8B8C2', text3: '#8C8C96', link: '#2997FF', logo: 'logoDark' },
  };
  // hola spectrum
  R.SPECTRUM = {
    lavender: '#7586EC', green: '#33C468', yellow: '#FFB823', orange: '#FF7039',
    pink: '#FF4F8B', magenta: '#D553D3', violet: '#6D5FF0', blue: '#3772F0',
  };
  R.F = { display: '"Inter Display", "Inter", system-ui, sans-serif', text: '"Inter", system-ui, sans-serif', code: 'ui-monospace, "SF Mono", Menlo, Consolas, monospace' };

  // `file` is the slug in downloaded file names, which stay in Spanish
  R.FORMATS = {
    // networks: ours where that size shows uncropped (Mastodon and X crop portrait images to 16:9 in the timeline)
    post:       { w: 1080, h: 1350, name: 'Post',       file: 'post',       networks: ['Instagram', 'Threads', 'LinkedIn', 'Bluesky'] },
    story:      { w: 1080, h: 1920, name: 'Story',      file: 'story',      networks: ['Instagram'], safe: [250, 1640] },
    square:     { w: 1080, h: 1080, name: 'Cuadrado',   file: 'cuadrado',   networks: ['X', 'Mastodon', 'Bluesky', 'LinkedIn', 'Instagram', 'Threads'] },
    horizontal: { w: 1200, h: 675,  name: 'Horizontal', file: 'horizontal', networks: ['X', 'Mastodon', 'LinkedIn', 'Bluesky'] },
    // event covers: only for what is announced as an event. Discord asks for 800×320 at least: this is double that.
    linkedin:   { w: 1776, h: 444,  name: 'Evento LinkedIn', file: 'linkedin', networks: ['LinkedIn'], pieces: ['session', 'event'], banner: true },
    discord:    { w: 1600, h: 640,  name: 'Evento Discord',  file: 'discord',  networks: ['Discord'],  pieces: ['session', 'event'], banner: true },
  };

  // In order of use: the monthly ones first. accent2 is the second combination of the colour theme ("Color 2").
  // In the two-column grid no two equal or similar colours sit next to each other (in a row or a column).
  // No yellow: in the colour theme the text is white and it cannot be read on it.
  R.formatsFor = (piece) => Object.keys(R.FORMATS).filter((f) => !R.FORMATS[f].pieces || R.FORMATS[f].pieces.includes(piece));
  R.PIECES = {
    session:  { name: 'Sesión mensual', accent: 'blue',    accent2: 'orange',  file: 'sesion' },
    event:    { name: 'Encuentro',      accent: 'orange',  accent2: 'violet',  file: 'evento' },
    notice:   { name: 'Aviso',          accent: 'pink',    accent2: 'blue',    file: 'aviso' },
    collage:  { name: 'Fotos',          accent: 'violet',  accent2: 'orange',  file: 'collage' },   // not 'photos': s.photos holds the uploaded photos
    person:   { name: 'Embajador/a',    accent: 'green',   accent2: 'blue',    file: 'persona' },
    question: { name: 'Pregunta',       accent: 'magenta', accent2: 'lavender', file: 'pregunta' },
    resource: { name: 'Recurso',        accent: 'orange',  accent2: 'green',   file: 'recurso' },
    sponsor:  { name: 'Patrocinador',   accent: 'blue',    accent2: 'magenta', file: 'patrocinador' },
    code:     { name: 'Código',         accent: null,      accent2: 'pink',    file: 'codigo' },     // no accent: the dot is in ink; in colour, violet
    logo:     { name: 'Logo',           accent: 'pink',    accent2: 'violet',  file: 'logo' },
  };
  R.themeAccent = (piece, theme) => (theme === 'color2' ? R.PIECES[piece].accent2 : R.PIECES[piece].accent || 'violet');

  // the website's 3D glyphs (without the sticker border), in the order they surround the logo: [key, label, file]
  R.GLYPHS = [['at', '@', 'arroba'], ['question', '?', 'pregunta'], ['code', '</>', 'codigo'], ['heart', '♥', 'corazon'], ['enye', 'ñ', 'enye'], ['braces', '{ }', 'llaves'], ['hand', 'La mano', 'mano'], ['bang', '!', 'bang']];

  // ── Assets ──────────────────────────────────────────────────────────────
  // Relative paths; a single-file build can set window.HOLA_SOCIAL_DATA to data: URIs keyed by these paths.
  R.PATHS = {
    hola: 'assets/tubo/hola.webp', holaWhite: 'assets/tubo/hola-blanco.webp', bang: 'assets/tubo/bang.webp',
    logoLight: 'assets/logo/hola-swift-horizontal-color.webp', logoDark: 'assets/logo/hola-swift-horizontal-color.webp',
    logoWhite: 'assets/logo/hola-swift-horizontal-blanco.webp',
    hColor: 'assets/logo/hola-swift-h-color.webp', hWhite: 'assets/logo/hola-swift-h-blanco.webp',
    stackedColor: 'assets/logo/hola-swift-apilado-color.webp', stackedWhite: 'assets/logo/hola-swift-apilado-blanco.webp',
    // 3D: renders from marca/holaSwift-logo-3d/generar-renders.py (the h was modelled with the same tube; the stacked one, without ¡ { !)
    h3dColor: 'assets/logo/hola-swift-h-3d-color.webp', h3dWhite: 'assets/logo/hola-swift-h-3d-blanco.webp',
    horizontal3dColor: 'assets/logo/hola-swift-horizontal-3d-color.webp', horizontal3dWhite: 'assets/logo/hola-swift-horizontal-3d-blanco.webp',
    stacked3dColor: 'assets/logo/hola-swift-apilado-3d-color.webp', stacked3dWhite: 'assets/logo/hola-swift-apilado-3d-blanco.webp',
  };
  R.GLYPHS.forEach(([key, , file]) => (R.PATHS['glyph-' + key] = key === 'bang' ? R.PATHS.bang : 'assets/glifos/' + file + '.webp'));   // the ! is the one from the 3D logo
  R.FONTS = [
    ['Inter Display', 'assets/fonts/InterDisplay-SemiBold.woff2', '600'],
    ['Inter Display', 'assets/fonts/InterDisplay-Bold.woff2', '700'],
    ['Inter', 'assets/fonts/Inter-Regular.woff2', '400'],
    ['Inter', 'assets/fonts/Inter-Medium.woff2', '500'],
    ['Inter', 'assets/fonts/Inter-SemiBold.woff2', '600'],
  ];
  R.img = {};
  R.load = async function () {
    const urls = window.HOLA_SOCIAL_DATA || {};
    const fonts = R.FONTS.map(([fam, url, w]) => {
      const f = new FontFace(fam, `url(${urls[url] || url})`, { weight: w });
      return f.load().then((ff) => document.fonts.add(ff)).catch(() => console.warn('Could not load', url));
    });
    const imgs = Object.entries(R.PATHS).map(([k, url]) => new Promise((ok) => {
      const im = new Image(); im.onload = () => { R.img[k] = im; ok(); }; im.onerror = () => { console.warn('Missing', url); ok(); };
      im.src = urls[url] || url;
    }));
    await Promise.all([...fonts, ...imgs]);
  };

  // ── Utilities ───────────────────────────────────────────────────────────
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  R.clamp = clamp;
  function font(ctx, fam, weight, px, track) {
    ctx.font = `${weight} ${px}px ${R.F[fam]}`;
    ctx.letterSpacing = (track || 0) * px + 'px';
  }
  function wrap(ctx, text, width) {                          // keeps manual line breaks
    const out = [];
    String(text || '').split('\n').forEach((par) => {
      const words = par.split(/\s+/).filter(Boolean); let l = '';
      if (!words.length) { out.push(''); return; }
      words.forEach((p) => { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > width && l) { out.push(l); l = p; } else l = t; });
      out.push(l);
    });
    return out;
  }
  // text that shrinks until it fits in maxLines and width; returns {lines, px, height}
  function fit(ctx, text, { fam = 'display', weight = 700, px, min, width, maxLines = 3, leading = 1.06, track = -0.02 }) {
    let s = px;
    for (; s >= min; s -= 2) {
      font(ctx, fam, weight, s, track);
      const ls = wrap(ctx, text, width);
      if (ls.length <= maxLines && ls.every((l) => ctx.measureText(l).width <= width)) return { lines: ls, px: s, height: ls.length * s * leading, fam, weight, leading, track };
    }
    font(ctx, fam, weight, min, track);
    const ls = wrap(ctx, text, width).slice(0, maxLines);
    return { lines: ls, px: min, height: ls.length * min * leading, fam, weight, leading, track };
  }
  function drawText(ctx, b, x, y, color, align = 'left') {
    font(ctx, b.fam, b.weight, b.px, b.track); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
    b.lines.forEach((l, i) => ctx.fillText(l, x, y + b.px * 0.92 + i * b.px * b.leading));
    ctx.textAlign = 'left';
  }
  function rounded(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); }
  // cover: object-fit cover + focus point (fx, fy in 0..1) + zoom
  function cover(ctx, im, x, y, w, h, fx = 0.5, fy = 0.4, zoom = 1) {
    const k = Math.max(w / im.width, h / im.height) * zoom, sw = im.width * k, sh = im.height * k;
    ctx.drawImage(im, x - (sw - w) * fx, y - (sh - h) * fy, sw, sh);
  }
  // ── Frame and background ──────────────────────────────────────────────────
  function frame(f) {
    const F = R.FORMATS[f], W = F.w, H = F.h, horiz = f === 'horizontal' || !!F.banner;
    // the covers, shorter than horizontal, scale by their height so everything fits
    const u = F.banner ? 0.92 * H / 675 : horiz ? 0.92 : W / 1080;
    const m = F.banner ? 52 * H / 675 : horiz ? 52 : 80 * u;
    const top = F.safe ? F.safe[0] : m, bottom = F.safe ? F.safe[1] : H - m;
    return { F, W, H, u, m, top, bottom, horiz, banner: !!F.banner, story: f === 'story', width: W - 2 * m, k: f === 'story' ? 1.12 : F.banner ? 1.3 : 1 };
  }
  // background: flat in light/dark; in "color", a soft gradient of the piece colour with its spectrum neighbours
  function background(ctx, M, T) {
    ctx.fillStyle = T.bg; ctx.fillRect(0, 0, M.W, M.H);
    if (T.blobs) {
      T.blobs.forEach(([c, x, y, r]) => dither(ctx, M, c, x, y, r));
    }
    const step = 30 * M.u, rp = 1.9 * M.u;

      horizontal: { '2d': ['logoLight', 'logoWhite'],       '3d': ['horizontal3dColor', 'horizontal3dWhite'] },
      stacked:    { '2d': ['stackedColor', 'stackedWhite'], '3d': ['stacked3dColor', 'stacked3dWhite'] },

    FIELDS[s.piece].forEach((c) => {
      if (c[0] === 'groups') { const g = groups(c[1], typeof c[2] === 'function' ? c[2](s[s.piece]) : c[2], c[3]); after.after(g); after = g; }
      else if (c[0] !== 'legend') cs.append(c[0] === 'row' ? row(c) : field(c));
    });
    cs.hidden = cs.children.length < 2;                      // only the legend: everything is in its own boxes
    const list = R.formatsFor(s.piece);
    if (!list.includes(s.format)) s.format = 'post';
    $$('.formats button').forEach((b) => (b.hidden = !list.includes(b.dataset.v)));
    $(".formats").style.gridTemplateColumns = `repeat(${list.length > 4 ? 3 : 4}, minmax(0, 1fr))`;   // six: two rows of three
    $('#all-formats').textContent = list.length === 4 ? 'Los cuatro formatos' : `Los ${list.length} formatos`;
    $$('#theme button').forEach((b) => {
      b.setAttribute('aria-pressed', b.dataset.v === s.theme);
      if (b.dataset.v.startsWith('color')) b.innerHTML = `<i style="background:${R.SPECTRUM[R.themeAccent(s.piece, b.dataset.v)]}"></i>Color ${b.dataset.v === 'color2' ? 2 : 1}`;
    });
    $('.range').hidden = ['person', 'collage', 'resource', 'sponsor'].includes(s.piece);
    $('.range').firstChild.textContent = { logo: 'Tamaño del logo ', notice: 'Tamaño del glifo ' }[s.piece] || 'Tamaño del tubo ';
  }
  function row(c) { const f = document.createElement('div'); f.className = 'row'; f.append(field(c[1]), field(c[2])); return f; }
  // one box with the photo and the details of each person; with several, a frame for each one inside the box
  function groups(title, items, help) {
    const fs = document.createElement('fieldset'); fs.className = 'groups';
    fs.innerHTML = `<legend>${title}</legend><p class="help"></p>`;
    $('.help', fs).textContent = help || `Arrastra ${items.length > 1 ? 'cada foto' : 'la foto'} en la vista previa para encuadrarla.`;
    items.forEach((it) => {
      const g = items.length > 1 ? Object.assign(document.createElement('div'), { className: 'group' }) : fs;
      if (it.title && items.length > 1) {
        const h = document.createElement('p'); h.className = 'group-title'; h.textContent = it.title;
        if (it.help) { const sm = document.createElement('small'); sm.textContent = it.help; h.append(' ', sm); }
        g.append(h);
      }
      g.append(photoControl(it.photo, ''));
      it.fields.forEach((c) => g.append(c[0] === 'row' ? row(c) : field(c)));
      if (g !== fs) fs.append(g);
    });
    return fs;
  }
  function photoControl(id, name) {
    const d = document.createElement('div'); d.className = 'photo';
    const f = s.photos[id];
    d.innerHTML = `<div class="mini" style="${f && f.src ? `background-image:url(${f.src})` : ''}"></div>
      <div class="ctl">${name ? `<b>${name}</b>` : ''}
        <div class="buttons"><label>${f && f.src ? 'Cambiar' : 'Subir'} foto<input type="file" accept="image/*" hidden></label>${f && f.src ? '<button type="button">Quitar</button>' : ''}</div>
        ${f && f.src ? `<label style="font-weight:400;font-size:13px;color:var(--text-3)">Zoom<input type="range" min="1" max="2.5" step="0.01" value="${f.zoom || 1}"></label>` : ''}
      </div>`;
    $('input[type=file]', d).onchange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const src = await downscale(file, 1600);
      s.photos[id] = { src, fx: 0.5, fy: 0.35, zoom: 1 }; await loadPhoto(id); build(); render();
    };
    const q = $('.buttons button', d); if (q) q.onclick = () => { delete s.photos[id]; delete photoImages[id]; build(); render(); };
    const r = $('input[type=range]', d); if (r) r.oninput = () => { s.photos[id].zoom = +r.value; photoImages[id].zoom = +r.value; render(); };
    return d;
  }
  function downscale(file, max) {
    return new Promise((ok, ko) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        // JPEG only if it already was one: a logo with transparency would come out with a black background. An SVG is drawn at the maximum size.
        const svg = file.type === 'image/svg+xml', iw = im.naturalWidth || 1200, ih = im.naturalHeight || 600;
        const k = svg ? max / Math.max(iw, ih) : Math.min(1, max / Math.max(iw, ih));

    });
  }
  function loadPhoto(id) {
    const f = s.photos[id]; if (!f || !f.src) return Promise.resolve();
    return new Promise((ok) => { const im = new Image(); im.onload = () => { photoImages[id] = { im, fx: f.fx, fy: f.fy, zoom: f.zoom || 1 }; ok(); }; im.onerror = ok; im.src = f.src; });
  }
  const scaleInput = $('#scale'), showScale = () => ($('#scale-value').textContent = Math.round((s.scale || 1) * 100) + ' %');
  scaleInput.value = s.scale || 1; showScale();
  scaleInput.oninput = () => { s.scale = +scaleInput.value; showScale(); render(); };
  scaleInput.ondblclick = () => { s.scale = 1; scaleInput.value = 1; showScale(); render(); };
  $$('#theme button').forEach((b) => (b.onclick = () => { s.theme = b.dataset.v; build(); render(); }));
  $("#reset").onclick = () => { const f = s.format; s = clone(R.BASE); s.photos = {}; s.format = f; for (const k in photoImages) delete photoImages[k]; $("#scale").value = 1; $("#scale-value").textContent = "100 %"; build(); render(); setStatus("Todo vuelve a los textos de ejemplo."); };

  // ── Formats and preview ──────────────────────────────────────────────────
  const canvas = $('canvas.artboard'), safeZone = $('.safe-zone');
  // the same icons as the holaswift.com footer, and in its order: each network always shows in the same place
  const ICONS = {"X": "<path fill=\"currentColor\" d=\"M17.8 3h3.1l-6.8 7.7 8 10.3h-6.2l-4.9-6.3L5.4 21H2.3l7.3-8.2L1.9 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z\"/>", "Mastodon": "<path fill=\"currentColor\" d=\"M23.268 5.313c-.35-2.578-2.617-4.61-5.304-5.004C17.51.242 15.792 0 11.813 0h-.03c-3.98 0-4.835.242-5.288.309C3.882.692 1.496 2.518.917 5.127.64 6.412.61 7.837.661 9.143c.074 1.874.088 3.745.26 5.611.118 1.24.325 2.47.62 3.68.55 2.237 2.777 4.098 4.96 4.857 2.336.792 4.849.923 7.256.38.265-.061.527-.132.786-.213.585-.184 1.27-.39 1.774-.753a.057.057 0 0 0 .023-.043v-1.809a.052.052 0 0 0-.02-.041.053.053 0 0 0-.046-.01 20.282 20.282 0 0 1-4.709.545c-2.73 0-3.463-1.284-3.674-1.818a5.593 5.593 0 0 1-.319-1.433.053.053 0 0 1 .066-.054c1.517.363 3.072.546 4.632.546.376 0 .75 0 1.125-.01 1.57-.044 3.224-.124 4.768-.422.038-.008.077-.015.11-.024 2.435-.464 4.753-1.92 4.989-5.604.008-.145.03-1.52.03-1.67.002-.512.167-3.63-.024-5.545zm-3.748 9.195h-2.561V8.29c0-1.309-.55-1.976-1.67-1.976-1.23 0-1.846.79-1.846 2.35v3.403h-2.546V8.663c0-1.56-.617-2.35-1.848-2.35-1.112 0-1.668.668-1.67 1.977v6.218H4.822V8.102c0-1.31.337-2.35 1.011-3.12.696-.77 1.608-1.164 2.74-1.164 1.311 0 2.302.5 2.962 1.498l.638 1.06.638-1.06c.66-.999 1.65-1.498 2.96-1.498 1.13 0 2.043.395 2.74 1.164.675.77 1.012 1.81 1.012 3.12z\"/>", "Bluesky": "<path fill=\"currentColor\" d=\"M5.9 3.6C8.2 5.3 10.6 8.8 11.5 10.7c.9-1.9 3.3-5.4 5.6-7.1 1.6-1.2 4.3-2.2 4.3.9 0 .6-.4 5.2-.6 5.9-.7 2.6-3.3 3.2-5.6 2.8 4 .7 5 3 2.8 5.2-4.2 4.3-6-1.1-6.5-2.5l-.1-.4-.1.4c-.5 1.4-2.3 6.8-6.5 2.5-2.2-2.2-1.2-4.5 2.8-5.2-2.3.4-4.9-.2-5.6-2.8-.2-.7-.6-5.3-.6-5.9 0-3.1 2.7-2.1 4.3-.9Z\"/>", "LinkedIn": "<path fill=\"currentColor\" d=\"M6.5 8.6H3V21h3.5V8.6ZM4.8 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM21 14.2c0-3.3-.7-5.9-4.6-5.9-1.9 0-3.1 1-3.6 2V8.6H9.4V21h3.5v-6.1c0-1.6.3-3.2 2.3-3.2s2 1.9 2 3.3V21H21v-6.8Z\"/>", "Instagram": "<path fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" d=\"M7.5 2.9h9a4.6 4.6 0 0 1 4.6 4.6v9a4.6 4.6 0 0 1-4.6 4.6h-9a4.6 4.6 0 0 1-4.6-4.6v-9a4.6 4.6 0 0 1 4.6-4.6Z\"/><circle cx=\"12\" cy=\"12\" r=\"4.1\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\"/><circle cx=\"17.3\" cy=\"6.7\" r=\"1.2\" fill=\"currentColor\"/>", "Threads": "<path fill=\"currentColor\" d=\"M12.186 24h-.007c-3.581-.024-6.334-1.205-8.184-3.509C2.35 18.44 1.5 15.586 1.472 12.01v-.017c.03-3.579.879-6.43 2.525-8.482C5.845 1.205 8.6.024 12.18 0h.014c2.746.02 5.043.725 6.826 2.098 1.677 1.29 2.858 3.13 3.509 5.467l-2.04.569c-1.104-3.96-3.898-5.984-8.304-6.015-2.91.022-5.11.936-6.54 2.717C4.307 6.504 3.616 8.914 3.589 12c.027 3.086.718 5.496 2.057 7.164 1.43 1.783 3.631 2.698 6.54 2.717 2.623-.02 4.358-.631 5.8-2.045 1.647-1.613 1.618-3.593 1.09-4.798-.31-.71-.873-1.3-1.634-1.75-.192 1.352-.622 2.446-1.284 3.272-.886 1.102-2.14 1.704-3.73 1.79-1.202.065-2.361-.218-3.259-.801-1.063-.689-1.685-1.74-1.752-2.964-.065-1.19.408-2.285 1.33-3.082.88-.76 2.119-1.207 3.583-1.291a13.853 13.853 0 0 1 3.02.142c-.126-.742-.375-1.332-.75-1.757-.513-.586-1.308-.883-2.359-.89h-.029c-.844 0-1.992.232-2.721 1.32L7.734 7.847c.98-1.454 2.568-2.256 4.478-2.256h.044c3.194.02 5.097 1.975 5.287 5.388.108.046.216.094.321.142 1.49.7 2.58 1.761 3.154 3.07.797 1.82.871 4.79-1.548 7.158-1.85 1.81-4.094 2.628-7.277 2.65Zm1.003-11.69c-.242 0-.487.007-.739.021-1.836.103-2.98.946-2.916 2.143.067 1.256 1.452 1.839 2.784 1.767 1.224-.065 2.818-.543 3.086-3.71a10.5 10.5 0 0 0-2.215-.221z\"/>"};
  ICONS.Discord = '<path fill="currentColor" d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>';
  const fmts = $('.formats');
  Object.entries(R.FORMATS).forEach(([k, F]) => {
    const b = document.createElement('button'); b.type = 'button'; b.dataset.v = k;
    const mini = document.createElement('canvas'); mini.width = 68; mini.height = Math.round(68 * F.h / F.w);
    b.append(mini); const t = document.createElement('span'); b.append(t);
    t.innerHTML = `<b>${F.name}</b><small>${F.w}×${F.h}</small><small class="networks">${Object.keys(ICONS).filter((r) => F.networks.includes(r)).map((r) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[r]}</svg>`).join('')}</small>`;
    b.setAttribute('aria-label', `${F.name}, ${F.w} por ${F.h}, para ${F.networks.join(', ')}`); b.title = F.networks.join(', ');
    b.onclick = () => { s.format = k; render(); };
    fmts.append(b);
  });
  let zones = [], pending = false, thumbTimer = 0;
  function render() {
    if (pending) return; pending = true;
    requestAnimationFrame(() => {
      pending = false;
      zones = R.compose(canvas, s.format, s, photoImages);
      setStatus(R.message || '');
      canvas.classList.toggle('draggable', zones.some((z) => photoImages[z.id]));
      $$('.formats button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === s.format));
      placeSafeZone();
      clearTimeout(thumbTimer); thumbTimer = setTimeout(thumbnails, 380);
    });
  }
  function thumbnails() {
    const tmp = document.createElement('canvas');
    $$('.formats button').forEach((b) => { R.compose(tmp, b.dataset.v, s, photoImages); const m = $('canvas', b); const c = m.getContext('2d'); c.clearRect(0, 0, m.width, m.height); c.drawImage(tmp, 0, 0, m.width, m.height); });
  }
  function placeSafeZone() {
    const F = R.FORMATS[s.format];
    if (!F.safe || !$('#show-safe').checked) { safeZone.hidden = true; return; }
    const r = canvas.getBoundingClientRect(), p = canvas.parentElement.getBoundingClientRect(), k = r.height / F.h;
    Object.assign(safeZone.style, { left: r.left - p.left + 'px', width: r.width + 'px', top: r.top - p.top + F.safe[0] * k + 'px', height: (F.safe[1] - F.safe[0]) * k + 'px' });
    safeZone.hidden = false;
  }
  $('#show-safe').onchange = placeSafeZone; addEventListener('resize', placeSafeZone);

  // drag to frame a photo
  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    const r = canvas.getBoundingClientRect(), k = canvas.width / r.width, x = (e.clientX - r.left) * k, y = (e.clientY - r.top) * k;
    const z = [...zones].reverse().find((z) => photoImages[z.id] && x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h);
    if (!z) return;
    drag = { z, x: e.clientX, y: e.clientY, k }; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing';
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const f = photoImages[drag.z.id], im = f.im, z = drag.z;
    const k = Math.max(z.w / im.width, z.h / im.height) * f.zoom, spareX = im.width * k - z.w, spareY = im.height * k - z.h;
    const dx = (e.clientX - drag.x) * drag.k, dy = (e.clientY - drag.y) * drag.k; drag.x = e.clientX; drag.y = e.clientY;
    if (spareX > 1) f.fx = R.clamp(f.fx - dx / spareX, 0, 1);
    if (spareY > 1) f.fy = R.clamp(f.fy - dy / spareY, 0, 1);

  });

  canvas.addEventListener('pointerup', release); canvas.addEventListener('pointercancel', release);

  // ── Export ───────────────────────────────────────────────────────────────
  const TOUCH = matchMedia('(pointer: coarse)').matches;
  if (TOUCH) $('#download').textContent = 'Compartir';
  const slug = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  // file names keep the Spanish slugs (pieces, formats, logo shapes) they had before the code was in English
  const LOGO_SHAPE_FILE = { h: 'h', horizontal: 'horizontal', stacked: 'apilado' };
  function fileName(fmt) {
    const d = s[s.piece], key = { session: d.word, person: d.name, event: d.word, code: d.file || d.text, question: d.question, collage: d.text, logo: LOGO_SHAPE_FILE[d.shape] || d.shape, notice: d.headline, resource: d.title, sponsor: d.company }[s.piece];
    return ['holaswift', R.PIECES[s.piece].file, slug(key), fmt && R.FORMATS[fmt].file].filter(Boolean).join('-') + '.png';
  }
  function blob(fmt) { const c = document.createElement('canvas'); R.compose(c, fmt, s, photoImages); return new Promise((ok) => c.toBlob(ok, 'image/png')); }
  // published as a claude.ai artifact, the viewer only allows downloads through its "downloads" capability
  let dlP = null;
  const downloads = () => (dlP = dlP || (window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null)));
  async function deliver(files) {
    const dl = await downloads();
    if (dl) {
      for (const f of files) {
        try { await dl.save({ filename: f.name, data: f }); }
        catch (e) { setStatus(e && e.code === 'declined' ? 'Descarga cancelada.' : 'No se pudo descargar ' + f.name + '.'); return false; }
      }
      return true;
    }
    if (TOUCH && navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files }); return true; } catch (e) { if (e.name === 'AbortError') return false; } }
    for (const f of files) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.append(a); a.click(); a.remove(); await new Promise((r) => setTimeout(r, 300)); }
    return true;
  }
  $('#download').onclick = async () => { const b = await blob(s.format); if (await deliver([new File([b], fileName(s.format), { type: 'image/png' })])) setStatus('Descargado: ' + fileName(s.format)); };
  $('#all-formats').onclick = async () => {
    const btn = $('#all-formats'); btn.disabled = true; setStatus('Preparando los formatos…');
    const files = [];
    for (const f of R.formatsFor(s.piece)) files.push(new File([await blob(f)], fileName(f), { type: 'image/png' }));
    try {
      if (TOUCH && !(await downloads())) throw 0;
      await loadZip();
      const zip = new window.JSZip(); files.forEach((f) => zip.file(f.name, f));
      const z = await zip.generateAsync({ type: 'blob' });
      const ok = await deliver([new File([z], fileName('').replace(/\.png$/, '.zip'), { type: 'application/zip' })]);
      btn.disabled = false; if (ok) setStatus('Listo: ' + files.length + ' imágenes en un zip.'); return;
    } catch (e) { const ok = await deliver(files); btn.disabled = false; if (ok) setStatus('Listo: ' + files.length + ' imágenes.'); return; }
  };
  function loadZip() {
    if (window.JSZip) return Promise.resolve();
    return new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = ok; sc.onerror = ko; document.head.append(sc); });
  }
  function setStatus(t) { $('#status').textContent = t; }

  // ── Startup ──────────────────────────────────────────────────────────────
  setStatus('Cargando tipografías e imágenes…');
  R.load().then(async () => {
    await Promise.all(Object.keys(s.photos || {}).map(loadPhoto));
    build(); render(); setStatus('');
  });
})();
